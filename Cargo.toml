[package]
name = "isen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A compact, strongly typed interpreted language"
license = "Apache-2.0"
readme = "README.md"
publish = false
build = "build.rs"

[features]
default = []
ml-kernels = []

[[bin]]
name = "isen"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"
